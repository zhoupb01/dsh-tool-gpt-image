# Bundle patch: inserts the image-generation tool row.
#
# No configuration is required. At load — and once more on the first call if the
# composition was still settling — the tool reads the model providers the user
# already configured in Settings, picks the one that advertises an image model,
# and reuses its endpoint (`baseURL`), credential reference (`apiKeyEnv`), and key.
#
# Optional fields, for operators only:
#   outputDir          directory, relative to the session workspace (default: images)
#   timeoutMs          per-request budget in ms (default: 300000)
#   imageModelPatterns extra globs that mark a model id as an image model
- insert:
    - id: tool-gpt-image
      name: 'dsh-tool-gpt-image'
      config:
        outputDir: images
